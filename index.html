<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>   Лабораторна робота №1 — Бібліотека  </title>
    <style>   
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
            line-height: 1.5;
        }
        button {
            padding: 8px 16px;
            margin: 0 6px 8px 0;
            cursor: pointer;
        }
        button[aria-pressed="true"] {
            background: #194d91;
            color: white;
            border: 2px solid #194d91;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 980px;
        }
        th, td {
            border: 1px solid #999;
            padding: 9px 12px;
            text-align: left;
        }
        th { background: #f0f3f7; }
        tr:nth-child(even) { background: #fafbfc; }
    </style>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Бібліотека</h1>
    <p>Предметна область: бібліотека.</p>

    <button type="button" data-table="books">Книги</button>
    <button type="button" data-table="readers">Читачі</button>
    <button type="button" data-table="workers">Працівники</button>

    <hr>

    <!-- Тут JavaScript сам створить заголовок, таблицю та всі рядки. -->
    <div id="table-container"></div>
</body>
</html>
